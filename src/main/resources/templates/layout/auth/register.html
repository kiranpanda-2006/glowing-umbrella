<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/main}">

<head>
	<title>Register</title>
</head>

<body>

	<main layout:fragment="content">

		<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-6">

			<div class="w-full max-w-sm">

				<!-- Header -->
				<div class="text-center mb-4">

					<div class="mx-auto mb-2 flex h-9 w-9 items-center justify-center
                            rounded-full bg-blue-100">

						<svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">

							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
								d="M18 9v3m0 0v3m0-3h3m-3 0h-3M9 12a4 4 0 100-8 4 4 0 000 8zm6 8a6 6 0 00-12 0" />

						</svg>

					</div>

					<h1 class="text-xl font-bold text-gray-900">
						Create Account
					</h1>

					<p class="text-xs text-gray-500 mt-1">
						Create your SmartJob account
					</p>

				</div>


				<!-- Form Card -->
				<div class="bg-white border border-gray-200 rounded-lg shadow-sm p-4">

					<form th:action="@{/auth/register}" th:object="${user}" method="post" class="space-y-3">

						<!-- Full Name -->
						<div>

							<label for="fullName" class="block mb-1 text-xs font-medium text-gray-700">
								Full Name
							</label>

							<input type="text" id="fullName" th:field="*{fullName}" placeholder="Enter your full name"
								class="w-full h-9 px-2.5 text-xs bg-gray-50
                                      border border-gray-300 text-gray-900
                                      rounded-md focus:ring-2
                                      focus:ring-blue-500 focus:border-blue-500">

							<!-- Validation Error -->
							<div th:replace="~{fragments/validation-message :: validationMessage('fullName')}">

							</div>


							<!-- Username -->
							<div>

								<label for="userName" class="block mb-1 text-xs font-medium text-gray-700">
									Username
								</label>

								<input type="text" id="userName" th:field="*{userName}" placeholder="Choose a username"
									class="w-full h-9 px-2.5 text-xs bg-gray-50
                                      border border-gray-300 text-gray-900
                                      rounded-md focus:ring-2
                                      focus:ring-blue-500 focus:border-blue-500">

								<!-- Validation Error -->
								<div th:replace="~{fragments/validation-message :: validationMessage('userName')}">

								</div>


								<!-- Email -->
								<div>

									<label for="email" class="block mb-1 text-xs font-medium text-gray-700">
										Email
									</label>

									<input type="email" id="email" th:field="*{email}" placeholder="name@example.com"
										class="w-full h-9 px-2.5 text-xs bg-gray-50
                                      border border-gray-300 text-gray-900
                                      rounded-md focus:ring-2
                                      focus:ring-blue-500 focus:border-blue-500">

									<!-- Validation Error -->
									<div th:replace="~{fragments/validation-message :: validationMessage('email')}">

									</div>

									<!-- Mobile Number -->
									<div>

										<label for="mobileNumber" class="block mb-1 text-xs font-medium text-gray-700">
											Mobile Number
										</label>

										<input type="tel" id="mobileNumber" th:field="*{mobileNumber}"
											placeholder="Enter mobile number" maxlength="10" inputmode="numeric" class="w-full h-9 px-2.5 text-xs bg-gray-50
                  border border-gray-300 text-gray-900
                  rounded-md focus:ring-2
                  focus:ring-blue-500 focus:border-blue-500">

										<!-- Validation Error -->
										<div
											th:replace="~{fragments/validation-message :: validationMessage('mobileNumber')}">

										</div>


										<!-- Password -->
										<div>

											<label for="password" class="block mb-1 text-xs font-medium text-gray-700">
												Password
											</label>

											<input type="password" id="password" th:field="*{password}"
												placeholder="Enter password" class="w-full h-9 px-2.5 text-xs bg-gray-50
                                      border border-gray-300 text-gray-900
                                      rounded-md focus:ring-2
                                      focus:ring-blue-500 focus:border-blue-500">

											<!-- Validation Error -->
											<div
												th:replace="~{fragments/validation-message :: validationMessage('password')}">

											</div>


											<!-- Confirm Password -->
											<div>

												<label for="confirmPassword"
													class="block mb-1 text-xs font-medium text-gray-700">
													Confirm Password
												</label>

												<input type="password" id="confirmPassword"
													th:field="*{confirmPassword}" placeholder="Confirm password" class="w-full h-9 px-2.5 text-xs bg-gray-50
                                      border border-gray-300 text-gray-900
                                      rounded-md focus:ring-2
                                      focus:ring-blue-500 focus:border-blue-500">
									  
									  <!--password error message-->
									  
									  <p th:if="${passwordError != null}"
									     th:text="${passwordError}"
									     class="mt-1 text-xs text-red-600">
									  </p>

										


											<!-- Terms -->
											<div class="flex items-center pt-1">

												<input id="terms" th:field="*{terms}" type="checkbox" class="w-3.5 h-3.5 rounded border-gray-300
                                      text-blue-600 focus:ring-blue-500">


												<label for="terms" class="ms-2 text-[11px] text-gray-500">

													I agree to the
													<a href="#" class="text-blue-600 hover:underline">
														Terms & Conditions
													</a>

												</label>

											</div>
											<!-- Validation Error -->
											<div
												th:replace="~{fragments/validation-message :: validationMessage('terms')}">
											</div>


												<!-- Submit -->
												<div class="flex justify-center">
													<button type="submit" class="w-36 h-9
                   bg-blue-600 hover:bg-blue-700
                   !text-blue-100
                   rounded-md
                   text-sm font-semibold
                   shadow-sm
                   transition duration-200">

														Create Account

													</button>
												</div>

					</form>

				</div>


				<!-- Login -->
				<p class="mt-5 text-center text-[11px] text-gray-500">

					Already have an account?

					<a href="/auth/login" class="font-medium text-blue-600 hover:underline">
						Sign in
					</a>

				</p>

			</div>

		</div>

	</main>

</body>

</html>

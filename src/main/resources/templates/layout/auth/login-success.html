<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

<head>
    <title>Login Successful</title>
</head>

<body>

<main layout:fragment="content">

    <div class="min-h-screen flex items-center justify-center px-4">

        <div class="w-full max-w-lg text-center">

            <!-- Success Icon -->
            <div class="flex justify-center mb-6">
                <div class="flex items-center justify-center w-20 h-20
                            rounded-full bg-green-100">

                    <svg class="w-10 h-10 text-green-600"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M5 13l4 4L19 7">
                        </path>

                    </svg>

                </div>
            </div>

            <!-- Message -->
            <h1 class="text-3xl font-bold text-gray-900 mb-4">
                Login Successfully!
            </h1>

            <p class="text-gray-600 text-lg mb-3">
                Welcome back!
            </p>

            <p class="text-gray-500 mb-8">
                Let's complete your profile for better job opportunities
                and personalized recommendations.
            </p>

            <!-- Next Button -->
            <a th:href="@{/create/profile}"
               class="inline-flex items-center justify-center
                      px-6 py-3 text-black bg-blue-600
                      hover:bg-blue-700 rounded-lg
                      font-medium">

                Next

                <svg class="w-5 h-5 ml-2"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M9 5l7 7-7 7">
                    </path>

                </svg>

            </a>

        </div>

    </div>

</main>

</body>
</html>

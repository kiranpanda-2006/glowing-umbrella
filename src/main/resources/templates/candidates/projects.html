<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

<head>
    <title>Projects</title>
</head>

<body>

<main layout:fragment="content">

    <div class="max-w-5xl mx-auto px-6 py-10">

        <!-- Header -->
        <div class="mb-8">

            <h1 class="text-3xl font-bold text-gray-900">
                Projects
            </h1>

            <p class="mt-2 text-gray-500">
                Showcase projects that demonstrate your skills and experience.
            </p>

        </div>


        <!-- Project Form -->
        <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">

            <h2 class="text-xl font-semibold text-gray-900 mb-6">
                Add Project
            </h2>

            <form id="projectForm"
                  th:action="@{/create/projects}"
                  th:object="${project}"
                  method="post">

                <!-- Project Name -->
                <div class="mb-6">

                    <label class="block mb-2 text-sm font-medium text-gray-900">
                        Project Name
                    </label>

                    <input type="text"
                           th:field="*{projectName}"
                           placeholder="e.g. Job Management System"
                           class="w-full p-2.5 border border-gray-300 rounded-lg
                                  focus:ring-blue-500 focus:border-blue-500">

                    <p th:if="${#fields.hasErrors('projectName')}"
                       th:errors="*{projectName}"
                       class="mt-1 text-sm text-red-600">
                    </p>

                </div>


                <!-- Description -->
                <div class="mb-6">

                    <label class="block mb-2 text-sm font-medium text-gray-900">
                        Project Description
                    </label>

                    <textarea th:field="*{projectDescription}"
                              rows="5"
                              placeholder="Describe your project, your role and what you achieved..."
                              class="w-full p-2.5 border border-gray-300 rounded-lg
                                     focus:ring-blue-500 focus:border-blue-500"></textarea>

                    <p th:if="${#fields.hasErrors('projectDescription')}"
                       th:errors="*{projectDescription}"
                       class="mt-1 text-sm text-red-600">
                    </p>

                </div>


                <!-- Technologies -->
                <div class="mb-6">

                    <label class="block mb-2 text-sm font-medium text-gray-900">
                        Technologies Used
                    </label>

                    <input type="text"
                           th:field="*{technologyUsed}"
                           placeholder="e.g. Java, Spring Boot, MySQL, JavaScript"
                           class="w-full p-2.5 border border-gray-300 rounded-lg
                                  focus:ring-blue-500 focus:border-blue-500">

                    <p th:if="${#fields.hasErrors('technologyUsed')}"
                       th:errors="*{technologyUsed}"
                       class="mt-1 text-sm text-red-600">
                    </p>

                </div>


                <!-- URLs -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- GitHub -->
                    <div>

                        <label class="block mb-2 text-sm font-medium text-gray-900">
                            GitHub URL
                        </label>

                        <input type="url"
                               th:field="*{githubUrl}"
                               placeholder="https://github.com/username/project"
                               class="w-full p-2.5 border border-gray-300 rounded-lg
                                      focus:ring-blue-500 focus:border-blue-500">

                        <p th:if="${#fields.hasErrors('githubUrl')}"
                           th:errors="*{githubUrl}"
                           class="mt-1 text-sm text-red-600">
                        </p>

                    </div>


                    <!-- Live URL -->
                    <div>

                        <label class="block mb-2 text-sm font-medium text-gray-900">
                            Live Project URL
                        </label>

                        <input type="url"
                               th:field="*{liveUrl}"
                               placeholder="https://example.com"
                               class="w-full p-2.5 border border-gray-300 rounded-lg
                                      focus:ring-blue-500 focus:border-blue-500">

                        <p th:if="${#fields.hasErrors('liveUrl')}"
                           th:errors="*{liveUrl}"
                           class="mt-1 text-sm text-red-600">
                        </p>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="flex justify-end gap-3 mt-8">

                    <button type="button"
                            class="px-5 py-2.5 text-sm font-medium
                                   text-gray-900 bg-gray-100
                                   hover:bg-gray-200 rounded-lg">

                        Clear

                    </button>

                    <button type="button"
                            class="px-5 py-2.5 text-sm font-medium
                                   text-white bg-blue-600
                                   hover:bg-blue-700 rounded-lg">

                        Add Project

                    </button>

                </div>

            </form>

        </div>


        <!-- Added Projects -->
        <div class="mt-8 bg-white border border-gray-200 rounded-xl shadow-sm p-6">

            <h2 class="text-xl font-semibold text-gray-900 mb-6">
                Your Projects
            </h2>


            <!-- Empty State -->
            <div class="text-center py-10">

                <svg class="w-12 h-12 mx-auto mb-3 text-gray-400"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="1.5"
                          d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>

                </svg>

                <p class="text-gray-500">
                    No projects added yet.
                </p>

                <p class="text-sm text-gray-400 mt-1">
                    Adding projects can help employers understand your skills.
                </p>

            </div>

        </div>


        <!-- Continue -->
        <div class="flex justify-end mt-6">

            <button type="submit"
                    form="projectForm"
                    class="px-6 py-2.5 text-sm font-medium text-white
                           bg-blue-600 hover:bg-blue-700 rounded-lg">

                Save & Continue

            </button>

        </div>

    </div>

</main>

</body>

</html>

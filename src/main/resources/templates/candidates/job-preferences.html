<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

<head>
    <title>Job Preferences</title>
</head>

<body>

<main layout:fragment="content">

    <div class="max-w-5xl mx-auto px-6 py-10">

        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">
                Job Preferences
            </h1>

            <p class="mt-2 text-gray-500">
                Tell us what kind of opportunities you're looking for.
            </p>
        </div>


        <!-- Preferences Form -->
        <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">

            <h2 class="text-xl font-semibold text-gray-900 mb-6">
                Your Preferences
            </h2>

            <form>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- Preferred Job Role -->
                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-900">
                            Preferred Job Role *
                        </label>

                        <input type="text"
                               name="preferredRole"
                               placeholder="e.g. Java Developer"
                               class="w-full p-2.5 border border-gray-300 rounded-lg
                                      focus:ring-blue-500 focus:border-blue-500">
                    </div>


                    <!-- Preferred Location -->
                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-900">
                            Preferred Location
                        </label>

                        <input type="text"
                               name="preferredLocation"
                               placeholder="e.g. Bangalore, Hyderabad"
                               class="w-full p-2.5 border border-gray-300 rounded-lg
                                      focus:ring-blue-500 focus:border-blue-500">
                    </div>


                    <!-- Employment Type -->
                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-900">
                            Employment Type *
                        </label>

                        <select name="employmentType"
                                class="w-full p-2.5 border border-gray-300 rounded-lg
                                       focus:ring-blue-500 focus:border-blue-500">

                            <option value="">Select employment type</option>
                            <option value="FULL_TIME">Full Time</option>
                            <option value="PART_TIME">Part Time</option>
                            <option value="INTERNSHIP">Internship</option>
                            <option value="CONTRACT">Contract</option>
                            <option value="FREELANCE">Freelance</option>

                        </select>
                    </div>


                    <!-- Experience Level -->
                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-900">
                            Experience Level *
                        </label>

                        <select name="experienceLevel"
                                class="w-full p-2.5 border border-gray-300 rounded-lg
                                       focus:ring-blue-500 focus:border-blue-500">

                            <option value="">Select experience level</option>
                            <option value="FRESHER">Fresher</option>
                            <option value="ENTRY_LEVEL">Entry Level</option>
                            <option value="MID_LEVEL">Mid Level</option>
                            <option value="SENIOR">Senior Level</option>

                        </select>
                    </div>


                    <!-- Expected Salary -->
                    <div>
                        <label class="block mb-2 text-sm font-medium text-gray-900">
                            Expected Salary
                        </label>

                        <input type="number"
                               name="expectedSalary"
                               placeholder="e.g. 600000"
                               class="w-full p-2.5 border border-gray-300 rounded-lg
                                      focus:ring-blue-500 focus:border-blue-500">
                    </div>

                </div>


                <!-- Work Mode -->
                <div class="mt-8">

                    <label class="block mb-3 text-sm font-medium text-gray-900">
                        Preferred Work Mode
                    </label>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

                        <label class="flex items-center p-4 border
                                      border-gray-300 rounded-lg cursor-pointer
                                      hover:bg-gray-50">

                            <input type="checkbox"
                                   name="workMode"
                                   value="ON_SITE"
                                   class="w-4 h-4 text-blue-600
                                          border-gray-300 rounded">

                            <span class="ml-3 text-sm font-medium">
                                On-site
                            </span>

                        </label>


                        <label class="flex items-center p-4 border
                                      border-gray-300 rounded-lg cursor-pointer
                                      hover:bg-gray-50">

                            <input type="checkbox"
                                   name="workMode"
                                   value="HYBRID"
                                   class="w-4 h-4 text-blue-600
                                          border-gray-300 rounded">

                            <span class="ml-3 text-sm font-medium">
                                Hybrid
                            </span>

                        </label>


                        <label class="flex items-center p-4 border
                                      border-gray-300 rounded-lg cursor-pointer
                                      hover:bg-gray-50">

                            <input type="checkbox"
                                   name="workMode"
                                   value="REMOTE"
                                   class="w-4 h-4 text-blue-600
                                          border-gray-300 rounded">

                            <span class="ml-3 text-sm font-medium">
                                Remote
                            </span>

                        </label>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="flex justify-end gap-3 mt-8">

                    <button type="button"
                            class="px-5 py-2.5 text-sm font-medium
                                   text-gray-900 bg-gray-100
                                   hover:bg-gray-200 rounded-lg">
                        Clear
                    </button>

                    <button type="button"
                            class="px-5 py-2.5 text-sm font-medium
                                   text-white bg-blue-600
                                   hover:bg-blue-700 rounded-lg">
                        Save Preferences
                    </button>

                </div>

            </form>

        </div>


        <!-- Complete Profile -->
        <div class="flex justify-end mt-6">

            <a href="/home/"
               class="px-6 py-2.5 text-sm font-medium text-white
                      bg-green-600 hover:bg-green-700 rounded-lg">

                Complete Profile

            </a>

        </div>

    </div>

</main>

</body>
</html>
